<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-label="Chronogramme des bits 0 et 1 du protocole WS2815">
  <style>
    svg {
      --paper: #f4f6f2; --ink: #23282b; --muted: #5d6862; --line: #d5dbd2;
      --accent: #b4622d; --ch1: #c34a38; --ch3: #3f7cb8;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --paper: #15181a; --ink: #e6e9e4; --muted: #98a29a; --line: #2f3639;
        --accent: #d98d51; --ch1: #e07a68; --ch3: #6fa7d8;
      }
    }
    .bg { fill: var(--paper); }
    .tb { fill: var(--ink); font-family: Arial, Helvetica, sans-serif; font-size: 13.5px; font-weight: 700; }
    .tm { fill: var(--ink); font-family: Consolas, Menlo, monospace; font-size: 11.5px; }
    .tms { fill: var(--muted); font-family: Consolas, Menlo, monospace; font-size: 10.5px; }
    .ta { fill: var(--accent); font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; }
    .w1 { stroke: var(--ch1); } .w3 { stroke: var(--ch3); }
    .wave { stroke-width: 2.2; fill: none; }
    .gridline { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; }
  </style>

  <rect x="0" y="0" width="560" height="300" class="bg"/>

  <!-- grille temporelle -->
  <line x1="80" y1="30" x2="80" y2="240" class="gridline"/>
  <line x1="188" y1="30" x2="188" y2="240" class="gridline"/>
  <line x1="332" y1="30" x2="332" y2="240" class="gridline"/>
  <line x1="530" y1="30" x2="530" y2="240" class="gridline"/>
  <text x="80" y="262" text-anchor="middle" class="tm">0</text>
  <text x="188" y="262" text-anchor="middle" class="tm">0,30 µs</text>
  <text x="332" y="262" text-anchor="middle" class="tm">0,70 µs</text>
  <text x="530" y="262" text-anchor="middle" class="tm">1,25 µs</text>
  <text x="80" y="282" text-anchor="middle" class="ta">UP</text>
  <text x="188" y="282" text-anchor="middle" class="ta">CC1</text>
  <text x="332" y="282" text-anchor="middle" class="ta">CC2</text>

  <!-- bit 0 -->
  <text x="20" y="75" class="tb">« 0 »</text>
  <polyline points="40,100 80,100 80,55 188,55 188,100 530,100" class="wave w3"/>
  <text x="134" y="47" text-anchor="middle" class="tms">T0H = 0,30 µs</text>

  <!-- bit 1 -->
  <text x="20" y="185" class="tb">« 1 »</text>
  <polyline points="40,210 80,210 80,165 332,165 332,210 530,210" class="wave w1"/>
  <text x="206" y="157" text-anchor="middle" class="tms">T1H = 0,70 µs</text>
</svg>
